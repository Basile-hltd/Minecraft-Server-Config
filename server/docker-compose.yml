# Configuration du serveur Minecraft (LE fichier à éditer).
# Doc des variables : https://docker-minecraft-server.readthedocs.io
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"                  # accepte l'EULA Mojang

      # --- RCON (le port 25575 n'est pas publié : accessible uniquement entre conteneurs) ---
      # En local : "dev". Déployé par Ansible : mot de passe aléatoire lu dans .env.
      # NE JAMAIS publier le port 25575 (voir README, section "Mot de passe RCON").
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-dev}"
      UID: "1500"                   # = mc_uid dans ansible/group_vars/all.yml
      GID: "1500"
      TZ: "Europe/Paris"

      # --- Type et version ---
      TYPE: "PAPER"                 # VANILLA, PAPER, FABRIC, FORGE, NEOFORGE...
      # Versions : définies dans ansible/group_vars/all.yml, écrites dans .env par Ansible.
      VERSION: "${MC_VERSION:?MC_VERSION manquant, voir README}"

      # --- Génération du monde (plugin Isohypse) ---
      # Style : Vanilla+, Realistic ou Fairy. Le générateur est activé par config/bukkit.yml ;
      # ses réglages sont dans config/plugins/Isohypse/config.yml. Ne s'applique qu'à un monde neuf.
      LEVEL_TYPE: "Realistic"

      # --- Ressources ---
      MEMORY: "10G"

      # --- Gameplay (server.properties) ---
      MOTD: "Serveur Minecraft"
      DIFFICULTY: "hard"
      MODE: "survival"
      MAX_PLAYERS: "20"
      SPAWN_PROTECTION: "0"         # pas de zone protégée autour du spawn
      VIEW_DISTANCE: "12"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"

      # --- Joueurs (pseudos séparés par des virgules) ---
      OPS: "Japrisot"
      WHITELIST: "Japrisot"
      # Garde les pseudos ajoutés depuis la page web (sinon la liste serait réécrite au démarrage).
      EXISTING_WHITELIST_FILE: "MERGE"

      # --- Plugins / mods ---
      # Supprime les anciens jars de plugins avant de télécharger ceux listés ici
      # (évite d'avoir deux versions d'Isohypse). Attention : supprime aussi les jars ajoutés à la main.
      REMOVE_OLD_MODS: "true"
      # Isohypse, depuis les releases GitHub du plugin.
      PLUGINS: "https://github.com/Basile-hltd/Minecraft-isohypse/releases/download/v${ISOHYPSE_VERSION:?ISOHYPSE_VERSION manquant, voir README}/isohypse-${ISOHYPSE_VERSION}-minecraft-${MC_LINE:?MC_LINE manquant, voir README}.jar"
      # LOD Server Support, depuis Modrinth (slug:numéro de version ; autres plugins à ajouter après une virgule).
      MODRINTH_PROJECTS: "lod-server-support:v${LSS_VERSION:?LSS_VERSION manquant, voir README}+paper+mc${MC_VERSION}"

      # --- Fichiers de config (bukkit.yml, configs des plugins) ---
      # config/ est copié à la racine de /data à chaque démarrage et écrase les fichiers du serveur :
      # c'est le dépôt qui fait foi (voir README, section "Réglages des plugins").
      COPY_CONFIG_DEST: "/data"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
    volumes:
      - ./data:/data
      - ./config:/config:ro         # copié dans /data au démarrage (COPY_CONFIG_DEST)

  # Page web pour ajouter un pseudo à la whitelist (voir README, section "Whitelist web").
  # Le script parle à Minecraft par RCON, sur le réseau interne : le port 25575 n'est toujours pas publié.
  whitelist:
    image: python:3-alpine
    container_name: minecraft-whitelist
    restart: unless-stopped
    depends_on:
      - mc
    user: "1500:1500"
    command: ["python", "-u", "/app/app.py"]
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:-dev}"
      WHITELIST_PASSWORD: "${WHITELIST_PASSWORD:?WHITELIST_PASSWORD manquant, voir README}"
    volumes:
      - ./whitelist:/app:ro

  # HTTPS devant la page de whitelist (certificat Let's Encrypt automatique pour WEB_HOSTNAME).
  web:
    image: caddy:2-alpine
    container_name: minecraft-web
    restart: unless-stopped
    depends_on:
      - whitelist
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_HOSTNAME: "${WEB_HOSTNAME:-localhost}"
    volumes:
      - ./whitelist/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # certificats : à garder, Let's Encrypt limite les demandes

  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      UID: "1500"
      GID: "1500"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
      INITIAL_DELAY: "5m"
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:-dev}"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups

volumes:
  caddy_data:
