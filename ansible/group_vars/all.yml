---
# Utilisateur système qui possède les fichiers du serveur
mc_user: minecraft
mc_uid: 1500   # doit correspondre à PUID/PGID dans server/docker-compose.yml

# Dossier de déploiement sur la machine
mc_dir: /opt/minecraft

# --- Versions (SEUL endroit à modifier) ---
# Version de Minecraft/Paper du serveur. Le jar de chaque plugin est choisi d'après elle :
# Isohypse d'après sa version majeure.mineure (26.3 -> isohypse-...-minecraft-26.3.jar),
# LOD Server Support d'après la version exacte (version Modrinth v<lss_version>+paper+mc<mc_version>).
mc_version: "26.3"
# Version du plugin Isohypse (tag de release de Basile-hltd/Minecraft-isohypse, sans le "v").
isohypse_version: "0.2.2"
# Version du plugin LOD Server Support (https://modrinth.com/plugin/lod-server-support, sans le "v").
lss_version: "0.20.0"
# Dérivé de mc_version : ne pas modifier.
mc_line: "{{ mc_version.split('.')[:2] | join('.') }}"

# Nom d'hôte public de la page de whitelist (Caddy y obtient son certificat HTTPS). Ports 80 et 443 à rediriger sur la box.
web_hostname: "hiltpold.internet-box.ch"

# Port Minecraft ouvert dans le pare-feu (doit correspondre à server/docker-compose.yml)
mc_port: 25565

# Port SSH conservé ouvert dans le pare-feu
ssh_port: 22

# Utilisateur d'administration : seul compte autorisé en SSH (par clé uniquement)
admin_user: basile

# Clés SSH autorisées pour admin_user. Au choix (ou les deux) :
# - ton nom d'utilisateur GitHub : Ansible récupère https://github.com/<user>.keys
admin_github_user: "Basile-hltd"
# - des clés publiques en clair (format "ssh-ed25519 AAAA... commentaire")
admin_ssh_public_keys: []
